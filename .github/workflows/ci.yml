name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt ruff
      - run: PYTHONPATH=backend python -m unittest discover -s backend/tests -v
      - run: python -m py_compile backend/app.py backend/phishion/*.py backend/phishion/routes/*.py backend/phishion/services/*.py
      - run: ruff check backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm run lint
      # `npm test` is still the "no test specified && exit 1" placeholder, and
      # jest is not in package.json, so a test step here would fail every run.
      # The production build is the real gate until a runner is added.
      - working-directory: frontend
        run: npm run build

  containers:
    runs-on: ubuntu-latest
    # Compose derives DATABASE_URL from the POSTGRES_* values, so only those
    # plus the app secrets are needed to validate and build.
    env:
      POSTGRES_USER: phishion
      POSTGRES_PASSWORD: test
      POSTGRES_DB: phishion
      SECRET_KEY: test-secret
      VIRUSTOTAL_API_KEY: test-key
      SECURITYTRAILS_API_KEY: test-key
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose
        run: docker compose config --quiet
      - name: Build images
        run: docker compose build

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
