services:
  frontend:
    container_name: phishion-frontend
    image: phishion_frontend:latest
    build:
       context: ./frontend
       dockerfile: next.dockerfile
       args:
         NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
         NEXT_PUBLIC_BACKEND_NAME: ${NEXT_PUBLIC_BACKEND_NAME:-api}
    ports:
       - "${FRONTEND_PORT:-3000}:3000"
    environment:
       - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:4000}
       - NEXT_PUBLIC_BACKEND_NAME=${NEXT_PUBLIC_BACKEND_NAME:-api}
    depends_on:
       - backend

  backend:
    container_name: phishion-backend
    image: phishion-backend:latest
    build:
      context: ./backend
      dockerfile: flask.dockerfile
    ports:
      - "4000:4000"
    environment:
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL is required}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:?GOOGLE_CLIENT_ID is required}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:?GOOGLE_CLIENT_SECRET is required}
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required}
      - VIRUSTOTAL_API_KEY=${VIRUSTOTAL_API_KEY:?VIRUSTOTAL_API_KEY is required}
      - SECURITYTRAILS_API_KEY=${SECURITYTRAILS_API_KEY:?SECURITYTRAILS_API_KEY is required}
    depends_on:
      - db

  db:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:?POSTGRES_USER is required}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - POSTGRES_DB=${POSTGRES_DB:?POSTGRES_DB is required}
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data:
    driver: local
