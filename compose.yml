services:
  frontend:
    container_name: phishion-frontend
    image: phishion_frontend:latest
    build:
      context: ./frontend
      dockerfile: next.dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
        NEXT_PUBLIC_BACKEND_NAME: ${NEXT_PUBLIC_BACKEND_NAME:-api}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
      NEXT_PUBLIC_BACKEND_NAME: ${NEXT_PUBLIC_BACKEND_NAME:-api}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    container_name: phishion-backend
    image: phishion-backend:latest
    build:
      context: .
      dockerfile: backend/flask.dockerfile
    ports:
      - "${BACKEND_PORT:-4000}:4000"
    environment:
      # Built from the POSTGRES_* values rather than read from DATABASE_URL, so
      # the host cannot drift from the db service name. A DATABASE_URL in .env
      # is for running the backend natively, where "db" would not resolve.
      DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      VIRUSTOTAL_API_KEY: ${VIRUSTOTAL_API_KEY:?VIRUSTOTAL_API_KEY is required}
      SECURITYTRAILS_API_KEY: ${SECURITYTRAILS_API_KEY:?SECURITYTRAILS_API_KEY is required}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      REDIS_URL: ${REDIS_URL:-}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    profiles: ["cache"]
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  proxy:
    image: caddy:2-alpine
    profiles: ["proxy"]
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      APP_HOST: ${APP_HOST:-localhost}
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy

volumes:
  db_data:
  caddy_data:
  caddy_config:
